<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>smoke test</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="content">
    <header class="content-header">
      <button class="icon-btn menu-btn" id="menuBtn">☰</button>
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
    </header>
    <div class="content-body" id="view"></div>
  </main>
</div>
<div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>

<pre id="results">RUNNING</pre>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/drawing-board.js"></script>
<script src="../js/games/draw-guess.js"></script>
<script src="../js/games/undercover.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
  var out = [];
  var failed = 0;

  function check(name, ok, detail) {
    if (!ok) failed++;
    out.push((ok ? 'PASS' : 'FAIL') + ' | ' + name + (detail ? ' | ' + detail : ''));
    document.getElementById('results').textContent = out.join('\n');
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function $(sel) { return document.querySelector(sel); }
  function $$(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

  window.confirm = function () { return true; };

  function drawStroke() {
    var canvas = $('#view canvas');
    var r = canvas.getBoundingClientRect();
    function ev(type, x, y) {
      canvas.dispatchEvent(new PointerEvent(type, {
        bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse',
        isPrimary: true, buttons: type === 'pointerup' ? 0 : 1,
        clientX: r.left + x, clientY: r.top + y
      }));
    }
    ev('pointerdown', r.width * 0.2, r.height * 0.3);
    ev('pointermove', r.width * 0.4, r.height * 0.5);
    ev('pointermove', r.width * 0.6, r.height * 0.4);
    ev('pointerup', r.width * 0.6, r.height * 0.4);
  }

  async function run() {
    try {
      /* ---------- 导航 ---------- */
      check('侧边栏渲染出 2 个小游戏', $$('#nav .nav-item').length === 2);
      check('导航项高亮', !!$('#nav .nav-item.is-active'));
      check('标题已设置', ($('#pageTitle').textContent || '').indexOf('你画我猜') >= 0,
        $('#pageTitle').textContent);

      /* ---------- 抽题 ---------- */
      check('初始为抽题界面', !!$('#view #drawBtn'));
      check('初始「重来/确定」禁用', $('#redrawBtn').disabled && $('#confirmBtn').disabled);

      $('#drawBtn').click();
      check('抽题动画中显示 rolling', $('#topicSlot').classList.contains('rolling'));
      await wait(1500);

      var topic = $('#topicSlot').textContent.trim();
      check('抽到一个非空题目', topic.length > 0, topic);
      check('题目来自 config 列表', window.GAME_CONFIG.drawGuess.topics.indexOf(topic) >= 0);
      check('「重来/确定」已可用', !$('#redrawBtn').disabled && !$('#confirmBtn').disabled);

      /* ---------- 重来 ---------- */
      $('#redrawBtn').click();
      await wait(1500);
      check('重来后仍有题目', $('#topicSlot').textContent.trim().length > 0,
        $('#topicSlot').textContent.trim());

      /* ---------- 确定 -> 进入游戏 ---------- */
      $('#confirmBtn').click();
      check('进入游戏界面', !!$('#view #boardHost canvas'));
      check('顶部显示第 1/N 轮', ($('#view .play-meta').textContent || '').indexOf('第 1 / 3 轮') >= 0,
        $('#view .play-meta').textContent.trim());
      check('A 阶段能看到题目', !!$('#view .topic-small'));
      check('画板工具栏：颜色 / 粗细 / 橡皮擦',
        $$('#view .swatch').length >= 8 && !!$('#view input[type=range]') && $$('#view [data-tool]').length === 2);
      check('倒计时已启动', $('#view .timer-value').textContent !== '--:--',
        $('#view .timer-value').textContent);

      /* ---------- 画一笔试试点 ---------- */
      drawStroke();
      await wait(120);
      var canvasData = $('#view canvas').toDataURL();
      check('画板上留下了笔迹', canvasData.length > 5000, 'png chars=' + canvasData.length);

      /* ---------- 走完整局 ---------- */
      var phases = 0;
      var seenB = false, seenTopicAgain = false;
      while (!$('#view .result') && phases < 10) {
        var meta = $('#view .play-meta');
        if (meta && meta.textContent.indexOf('B · 猜词') >= 0) {
          seenB = true;
          check('B 阶段不再显示题目，只给参考画',
            !$('#view .topic-small') && !!$('#view .ref-img'), '');
        }
        if (meta && meta.textContent.indexOf('第 2 / 3 轮') >= 0) { seenTopicAgain = true; }

        drawStroke();
        await wait(120);
        var btn = $('#view #nextBtn');
        if (!btn) break;
        await wait(500);          // 等过输入锁
        btn.click();
        phases++;
        await wait(250);
      }

      check('6 个阶段全部走完', phases === 6, 'phases=' + phases);
      check('过程中出现过 B 猜词阶段', seenB);
      check('第 2 轮开始 A 参考上一轮猜词', seenTopicAgain);
      check('进入结果页', !!$('#view .result'));
      check('结果页展示 6 张作品', $$('#view .artwork-card').length === 6,
        'cards=' + $$('#view .artwork-card').length);
      check('结果页显示起始题目', ($('#view .result-topic').textContent || '').trim().length > 0,
        $('#view .result-topic').textContent.trim());
      check('每张作品都有保存按钮', $$('#view [data-save]').length === 6);
      check('作品图片是 PNG dataURL',
        ($('#view .artwork-card img') || {}).src ? $('#view .artwork-card img').src.indexOf('data:image/png') === 0 : false);
      check('有「保存全部作品」按钮', !!$('#view #saveAllBtn') && !$('#saveAllBtn').disabled);
      check('有「再玩一局」按钮', !!$('#view #againBtn'));

      /* ---------- 再玩一局 ---------- */
      $('#againBtn').click();
      check('回到抽题界面', !!$('#view #drawBtn'));
      check('重新开始后作品已清空', $$('#view .artwork-card').length === 0);

      /* ---------- 倒计时到点自动进入下一阶段 ---------- */
      window.GAME_CONFIG.drawGuess.timer = { a: 2, b: 2 };
      $$('#nav .nav-item')[0].click();     // 重新挂载，读取新配置
      await wait(50);
      $('#drawBtn').click();
      await wait(1500);
      $('#confirmBtn').click();
      check('新配置生效（A 2 秒）', $('#view .timer-value').textContent.trim() === '00:02',
        $('#view .timer-value').textContent);

      var sawTimeUp = false;
      var deadline = Date.now() + 12000;
      while (Date.now() < deadline) {
        var overlay = $('#view #timeup');
        if (overlay && !overlay.hidden) sawTimeUp = true;
        var m = $('#view .play-meta');
        if (m && m.textContent.indexOf('B · 猜词') >= 0) break;
        await wait(100);
      }
      check('时间到会弹出提示', sawTimeUp);
      check('时间到后自动进入 B 阶段',
        ($('#view .play-meta') || {}).textContent ? $('#view .play-meta').textContent.indexOf('B · 猜词') >= 0 : false,
        ($('#view .play-meta') || {}).textContent);
      check('B 阶段倒计时用的是 b 配置', $('#view .timer-value').textContent.trim() === '00:02',
        $('#view .timer-value').textContent);

      /* ============================================================
         谁是卧底
         ============================================================ */
      $$('#nav .nav-item')[1].click();
      await wait(80);

      check('切换到「谁是卧底」', ($('#pageTitle').textContent || '').indexOf('谁是卧底') >= 0,
        $('#pageTitle').textContent);
      check('抽题界面已渲染', !!$('#view #ucDrawBtn'));
      check('默认 4 人', $('#view #ucCount').value === '4', $('#view #ucCount').value);
      check('名字输入框数量 = 人数', $$('#view .uc-name-field input').length === 4);
      check('初始「开始发牌」禁用', $('#ucStartBtn').disabled);
      check('初始「查看本题」禁用', $('#ucPeekBtn').disabled);

      /* ---------- 抽题 ----------
         点一下直接出结果，不做「滚动显示」动画：滚动时会掠过题目池里
         其他词，等于把可能的题目泄露出去了。 */
      $('#ucDrawBtn').click();
      check('抽题不再滚动，点下去立刻是最终状态',
        $('#ucTopicSlot').className.indexOf('is-rolling') < 0 &&
        $('#ucTopicSlot').className.indexOf('is-hidden') >= 0,
        $('#ucTopicSlot').className);

      var allWords = [];
      window.GAME_CONFIG.undercover.topics.forEach(function (t) {
        allWords.push(t.normal, t.spy);
      });
      check('抽题过程中不会闪过任何题目词（不泄题）',
        allWords.every(function (w) { return $('#ucTopicSlot').textContent.indexOf(w) < 0; }),
        $('#ucTopicSlot').textContent.trim());
      await wait(50);

      check('抽到题目后按钮可用', !$('#ucRedrawBtn').disabled && !$('#ucStartBtn').disabled);
      check('题目默认藏起来（防剧透）', $('#ucTopicSlot').className.indexOf('is-hidden') >= 0,
        $('#ucTopicSlot').className);

      /* ---------- 主持人查看本题 ---------- */
      $('#ucPeekBtn').click();
      await wait(30);
      var shownText = $('#ucTopicSlot').textContent;
      check('主持人可以查看本题', $('#ucTopicSlot').className.indexOf('is-shown') >= 0 &&
        shownText.indexOf('卧底') >= 0, shownText.trim());
      var matched = window.GAME_CONFIG.undercover.topics.filter(function (t) {
        return t && typeof t.normal === 'string' &&
          shownText.indexOf(t.normal) >= 0 && shownText.indexOf(t.spy) >= 0;
      });
      check('查看的两个词来自 config 的同一组题', matched.length >= 1, shownText.trim());
      $('#ucPeekBtn').click();
      await wait(30);

      /* ---------- 换一题：同一套逻辑，也必须立刻出结果 ---------- */
      $('#ucRedrawBtn').click();
      await wait(30);
      check('「换一题」同样不滚动，立刻出结果',
        $('#ucTopicSlot').className.indexOf('is-rolling') < 0 &&
        $('#ucTopicSlot').className.indexOf('is-hidden') >= 0,
        $('#ucTopicSlot').className);
      $('#ucPeekBtn').click();
      await wait(30);
      check('「换一题」确实换了一组词', $('#ucTopicSlot').textContent !== shownText,
        shownText.trim() + '  ->  ' + $('#ucTopicSlot').textContent.trim());
      $('#ucPeekBtn').click();
      await wait(30);

      /* ---------- 题目列表：平时折叠，展开可手动指定 ---------- */
      var topics = window.GAME_CONFIG.undercover.topics;
      var t0 = topics[0];
      var t0n = typeof t0.normal === 'string' ? t0.normal : t0.normal.text;
      var t0s = typeof t0.spy === 'string' ? t0.spy : t0.spy.text;

      check('题目列表默认是折叠的', $('#view #ucPicker').open === false);

      $('#view #ucPicker summary').click();
      await wait(30);
      check('点一下标题栏就展开', $('#view #ucPicker').open === true);
      check('展开后列出全部题目', $$('#view .uc-pick-item').length === topics.length,
        'items=' + $$('#view .uc-pick-item').length);
      check('列表只列文字，不放图片', $$('#view .uc-pick-list img').length === 0);
      check('每条都写明「普通词 / 卧底词」',
        $$('#view .uc-pick-item')[0].textContent.indexOf(t0n) >= 0 &&
        $$('#view .uc-pick-item')[0].textContent.indexOf(t0s) >= 0,
        $$('#view .uc-pick-item')[0].textContent.trim());

      $$('#view .uc-pick-item')[0].click();
      await wait(30);
      check('点一组就直接把它指定为本题',
        !$('#ucStartBtn').disabled && $('#ucTopicSlot').className.indexOf('is-hidden') >= 0,
        $('#ucTopicSlot').className);
      check('指定完自动收起列表', $('#view #ucPicker').open === false);

      $('#view #ucPicker summary').click();
      await wait(30);
      check('被选中的那一组会高亮',
        $$('#view .uc-pick-item')[0].classList.contains('is-active'));
      $('#view #ucPicker summary').click();
      await wait(30);
      check('再点一次标题栏就收起', $('#view #ucPicker').open === false);

      /* ---------- 改人数 ---------- */
      $('#ucPlus').click();
      await wait(30);
      check('加号改人数 -> 5 人', $('#ucCount').value === '5', $('#ucCount').value);
      check('名字输入框跟着变成 5 个', $$('#view .uc-name-field input').length === 5);

      var nameInputs = $$('#view .uc-name-field input');
      nameInputs[0].value = '小明';
      nameInputs[0].dispatchEvent(new Event('input', { bubbles: true }));

      /* ---------- 发牌 ---------- */
      $('#ucStartBtn').click();
      await wait(80);
      check('发牌后出现 5 张卡片', $$('#view .uc-card').length === 5,
        'cards=' + $$('#view .uc-card').length);
      check('卡片默认全部盖着', $$('#view .uc-card.is-open').length === 0);
      check('每张卡片都有按住按钮', $$('#view .uc-hold-btn').length === 5);
      check('第一张卡片用了改过的名字',
        $('#view .uc-card .uc-card-name').textContent === '小明',
        $('#view .uc-card .uc-card-name').textContent);
      check('卡片有配图位且指向本地图片文件夹',
        $$('#view .uc-card-media img').length === 5 &&
        $('#view .uc-card-media img').getAttribute('src').indexOf('images/undercover/') === 0,
        $('#view .uc-card-media img').getAttribute('src'));
      check('卡片上不显示卧底身份', $$('#view .uc-card.is-spy').length === 0 &&
        ($('#view .uc-card .uc-card-role').textContent || '') === '');

      /* ---------- 按住查看 / 松手消失 ---------- */
      var holdBtn = $$('#view .uc-hold-btn')[0];
      holdBtn.dispatchEvent(new PointerEvent('pointerdown', {
        bubbles: true, cancelable: true, pointerId: 11, pointerType: 'mouse',
        isPrimary: true, buttons: 1
      }));
      await wait(30);
      check('按住按钮 -> 这张卡片翻开', $$('#view .uc-card')[0].classList.contains('is-open'));
      check('只翻开被按住的那一张', $$('#view .uc-card.is-open').length === 1,
        'open=' + $$('#view .uc-card.is-open').length);

      /* 回归：翻转动画会把按钮转到指针命中范围之外，浏览器会跟着补发
         pointerleave / pointerout。卡片绝不能因此被关掉 —— 这正是
         「按一下不翻、要点好几下」那个 bug 的成因。 */
      holdBtn.dispatchEvent(new PointerEvent('pointerleave', {
        bubbles: false, cancelable: true, pointerId: 11, pointerType: 'mouse', isPrimary: true
      }));
      holdBtn.dispatchEvent(new PointerEvent('pointerout', {
        bubbles: true, cancelable: true, pointerId: 11, pointerType: 'mouse', isPrimary: true
      }));
      await wait(150);
      check('翻转途中收到 pointerleave / pointerout 也不会误关卡片',
        $$('#view .uc-card.is-open').length === 1,
        'open=' + $$('#view .uc-card.is-open').length);

      window.dispatchEvent(new PointerEvent('pointerup', {
        bubbles: true, cancelable: true, pointerId: 11, pointerType: 'mouse',
        isPrimary: true, buttons: 0
      }));
      await wait(30);
      check('松开 -> 卡片自动盖回去', $$('#view .uc-card.is-open').length === 0);
      check('看过之后标记「已查看」', !$('#view .uc-card .uc-card-seen').hidden);

      /* ---------- 触屏长按 ---------- */
      var touchBtn = $$('#view .uc-hold-btn')[4];
      touchBtn.dispatchEvent(new PointerEvent('pointerdown', {
        bubbles: true, cancelable: true, pointerId: 21, pointerType: 'touch',
        isPrimary: true, buttons: 1
      }));
      await wait(30);
      check('手指按住同样能翻开', $$('#view .uc-card')[4].classList.contains('is-open'));
      window.dispatchEvent(new PointerEvent('pointerup', {
        bubbles: true, cancelable: true, pointerId: 21, pointerType: 'touch',
        isPrimary: true, buttons: 0
      }));
      await wait(30);
      check('手指松开 -> 卡片盖回去', $$('#view .uc-card.is-open').length === 0);

      /* ---------- 恰好 1 个人词不一样 ---------- */
      var words = $$('#view .uc-card').map(function (card) {
        return card.querySelector('.uc-card-word').textContent.trim();
      });
      var uniq = words.filter(function (w, i) { return words.indexOf(w) === i; });
      check('所有卡片一共只有两种词', uniq.length === 2, uniq.join(' / '));
      var counts = uniq.map(function (w) {
        return words.filter(function (x) { return x === w; }).length;
      }).sort();
      check('恰好 1 个卧底 + 4 个普通玩家', counts[0] === 1 && counts[1] === 4, '分布 ' + counts.join(':'));
      check('发出来的牌正好是手动指定的那一组',
        uniq.length === 2 && uniq.indexOf(t0n) >= 0 && uniq.indexOf(t0s) >= 0,
        uniq.join(' / '));

      /* ---------- 一键翻开 / 扣上（永久） ---------- */
      $('#ucFlipBtn').click();
      await wait(30);
      check('一键翻开 -> 全部卡片都翻开', $$('#view .uc-card.is-open').length === 5,
        'open=' + $$('#view .uc-card.is-open').length);
      check('翻开后只有 1 张是卧底', $$('#view .uc-card.is-spy').length === 1);
      check('每张卡片都标出身份', $$('#view .uc-card-role').filter(function (el) {
        return el.textContent.trim().length > 0;
      }).length === 5);
      check('翻开后公布卧底是谁', !$('#ucBanner').hidden &&
        $('#ucBanner').textContent.indexOf('卧底') >= 0, $('#ucBanner').textContent.trim());
      check('按钮变成「一键扣上」', $('#ucFlipBtn').textContent.indexOf('扣上') >= 0,
        $('#ucFlipBtn').textContent);

      $('#ucFlipBtn').click();
      await wait(30);
      check('再点一次 -> 全部扣上', $$('#view .uc-card.is-open').length === 0);
      check('扣上后不再显示身份', $$('#view .uc-card.is-spy').length === 0 && $('#ucBanner').hidden);

      /* ---------- 换一题重发 / 返回设置 ---------- */
      $('#ucRedealBtn').click();
      await wait(80);
      check('换一题重发后仍是 5 张卡片', $$('#view .uc-card').length === 5);
      check('重发后卡片全部盖着', $$('#view .uc-card.is-open').length === 0);

      $('#ucSetupBtn').click();
      await wait(80);
      check('返回设置界面', !!$('#view #ucDrawBtn'));
      check('返回后人数保持不变', $('#view #ucCount').value === '5', $('#view #ucCount').value);
      check('返回后题目还在，可以直接再发牌', !$('#ucStartBtn').disabled);
    } catch (err) {
      check('运行期异常', false, err && (err.message + ' @ ' + (err.stack || '').split('\n')[1]));
    }

    out.push('=== TOTAL ' + out.length + ' / FAILED ' + failed + ' ===');
    document.getElementById('results').textContent = out.join('\n');
  }

  window.addEventListener('load', function () { setTimeout(run, 100); });
})();
</script>
</body>
</html>
