<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>smoke test</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="content">
    <header class="content-header">
      <button class="icon-btn menu-btn" id="menuBtn">☰</button>
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
    </header>
    <div class="content-body" id="view"></div>
  </main>
</div>
<div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>

<pre id="results">RUNNING</pre>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/drawing-board.js"></script>
<script src="../js/games/draw-guess.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
  var out = [];
  var failed = 0;

  function check(name, ok, detail) {
    if (!ok) failed++;
    out.push((ok ? 'PASS' : 'FAIL') + ' | ' + name + (detail ? ' | ' + detail : ''));
    document.getElementById('results').textContent = out.join('\n');
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function $(sel) { return document.querySelector(sel); }
  function $$(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

  window.confirm = function () { return true; };

  function drawStroke() {
    var canvas = $('#view canvas');
    var r = canvas.getBoundingClientRect();
    function ev(type, x, y) {
      canvas.dispatchEvent(new PointerEvent(type, {
        bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse',
        isPrimary: true, buttons: type === 'pointerup' ? 0 : 1,
        clientX: r.left + x, clientY: r.top + y
      }));
    }
    ev('pointerdown', r.width * 0.2, r.height * 0.3);
    ev('pointermove', r.width * 0.4, r.height * 0.5);
    ev('pointermove', r.width * 0.6, r.height * 0.4);
    ev('pointerup', r.width * 0.6, r.height * 0.4);
  }

  async function run() {
    try {
      /* ---------- 导航 ---------- */
      check('侧边栏渲染出 1 个小游戏', $$('#nav .nav-item').length === 1);
      check('导航项高亮', !!$('#nav .nav-item.is-active'));
      check('标题已设置', ($('#pageTitle').textContent || '').indexOf('你画我猜') >= 0,
        $('#pageTitle').textContent);

      /* ---------- 抽题 ---------- */
      check('初始为抽题界面', !!$('#view #drawBtn'));
      check('初始「重来/确定」禁用', $('#redrawBtn').disabled && $('#confirmBtn').disabled);

      $('#drawBtn').click();
      check('抽题动画中显示 rolling', $('#topicSlot').classList.contains('rolling'));
      await wait(1500);

      var topic = $('#topicSlot').textContent.trim();
      check('抽到一个非空题目', topic.length > 0, topic);
      check('题目来自 config 列表', window.GAME_CONFIG.drawGuess.topics.indexOf(topic) >= 0);
      check('「重来/确定」已可用', !$('#redrawBtn').disabled && !$('#confirmBtn').disabled);

      /* ---------- 重来 ---------- */
      $('#redrawBtn').click();
      await wait(1500);
      check('重来后仍有题目', $('#topicSlot').textContent.trim().length > 0,
        $('#topicSlot').textContent.trim());

      /* ---------- 确定 -> 进入游戏 ---------- */
      $('#confirmBtn').click();
      check('进入游戏界面', !!$('#view #boardHost canvas'));
      check('顶部显示第 1/N 轮', ($('#view .play-meta').textContent || '').indexOf('第 1 / 3 轮') >= 0,
        $('#view .play-meta').textContent.trim());
      check('A 阶段能看到题目', !!$('#view .topic-small'));
      check('画板工具栏：颜色 / 粗细 / 橡皮擦',
        $$('#view .swatch').length >= 8 && !!$('#view input[type=range]') && $$('#view [data-tool]').length === 2);
      check('倒计时已启动', $('#view .timer-value').textContent !== '--:--',
        $('#view .timer-value').textContent);

      /* ---------- 画一笔试试点 ---------- */
      drawStroke();
      await wait(120);
      var canvasData = $('#view canvas').toDataURL();
      check('画板上留下了笔迹', canvasData.length > 5000, 'png chars=' + canvasData.length);

      /* ---------- 走完整局 ---------- */
      var phases = 0;
      var seenB = false, seenTopicAgain = false;
      while (!$('#view .result') && phases < 10) {
        var meta = $('#view .play-meta');
        if (meta && meta.textContent.indexOf('B · 猜词') >= 0) {
          seenB = true;
          check('B 阶段不再显示题目，只给参考画',
            !$('#view .topic-small') && !!$('#view .ref-img'), '');
        }
        if (meta && meta.textContent.indexOf('第 2 / 3 轮') >= 0) { seenTopicAgain = true; }

        drawStroke();
        await wait(120);
        var btn = $('#view #nextBtn');
        if (!btn) break;
        await wait(500);          // 等过输入锁
        btn.click();
        phases++;
        await wait(250);
      }

      check('6 个阶段全部走完', phases === 6, 'phases=' + phases);
      check('过程中出现过 B 猜词阶段', seenB);
      check('第 2 轮开始 A 参考上一轮猜词', seenTopicAgain);
      check('进入结果页', !!$('#view .result'));
      check('结果页展示 6 张作品', $$('#view .artwork-card').length === 6,
        'cards=' + $$('#view .artwork-card').length);
      check('结果页显示起始题目', ($('#view .result-topic').textContent || '').trim().length > 0,
        $('#view .result-topic').textContent.trim());
      check('每张作品都有保存按钮', $$('#view [data-save]').length === 6);
      check('作品图片是 PNG dataURL',
        ($('#view .artwork-card img') || {}).src ? $('#view .artwork-card img').src.indexOf('data:image/png') === 0 : false);
      check('有「保存全部作品」按钮', !!$('#view #saveAllBtn') && !$('#saveAllBtn').disabled);
      check('有「再玩一局」按钮', !!$('#view #againBtn'));

      /* ---------- 再玩一局 ---------- */
      $('#againBtn').click();
      check('回到抽题界面', !!$('#view #drawBtn'));
      check('重新开始后作品已清空', $$('#view .artwork-card').length === 0);

      /* ---------- 倒计时到点自动进入下一阶段 ---------- */
      window.GAME_CONFIG.drawGuess.timer = { a: 2, b: 2 };
      $$('#nav .nav-item')[0].click();     // 重新挂载，读取新配置
      await wait(50);
      $('#drawBtn').click();
      await wait(1500);
      $('#confirmBtn').click();
      check('新配置生效（A 2 秒）', $('#view .timer-value').textContent.trim() === '00:02',
        $('#view .timer-value').textContent);

      var sawTimeUp = false;
      var deadline = Date.now() + 12000;
      while (Date.now() < deadline) {
        var overlay = $('#view #timeup');
        if (overlay && !overlay.hidden) sawTimeUp = true;
        var m = $('#view .play-meta');
        if (m && m.textContent.indexOf('B · 猜词') >= 0) break;
        await wait(100);
      }
      check('时间到会弹出提示', sawTimeUp);
      check('时间到后自动进入 B 阶段',
        ($('#view .play-meta') || {}).textContent ? $('#view .play-meta').textContent.indexOf('B · 猜词') >= 0 : false,
        ($('#view .play-meta') || {}).textContent);
      check('B 阶段倒计时用的是 b 配置', $('#view .timer-value').textContent.trim() === '00:02',
        $('#view .timer-value').textContent);
    } catch (err) {
      check('运行期异常', false, err && (err.message + ' @ ' + (err.stack || '').split('\n')[1]));
    }

    out.push('=== TOTAL ' + out.length + ' / FAILED ' + failed + ' ===');
    document.getElementById('results').textContent = out.join('\n');
  }

  window.addEventListener('load', function () { setTimeout(run, 100); });
})();
</script>
</body>
</html>
